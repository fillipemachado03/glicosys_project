    <div class="paciente-card">
      <div class="rotulo">Paciente</div>
      <div class="nome" id="sidebar-nome">—</div>
      <div class="info" id="sidebar-info">—</div>

    <ul class="sidebar-nav">
      <li><a href="painel.html">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
        Painel

      <li><a href="glicemia.html" class="ativo">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>

      <li><a href="refeicoes.html">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 2v7c0 1-1 2-2 2s-2-1-2-2V2M14 11v11M6 2v9c0 1 1 2 2 2h0v9"/></svg>

      <li><a href="alimentos.html">

        Alimentos (IG)

      <li><a href="perfil.html">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-7 8-7s8 3 8 7"/></svg>
        Meu Perfil
      </a></li>
    </ul>

    <div class="sidebar-sair">
      <a href="login.html" id="link-sair">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
        Sair
      </a>
    </div>
  </aside>

  <main class="conteudo">

    <div class="cabecalho-pagina">
      <h1>Registrar Glicemia</h1>
      <p>Adicione uma nova medição de glicose</p>
    </div>

    <div class="card">
      <form action="backend\registrar_glicemia.php" method="post">

        <div class="form-linha">
          <div class="campo">
            <label for="data">Data</label>
            <input type="date" id="data" name="data">
          </div>
          <div class="campo">
            <label for="hora">Hora</label>
            <input type="time" id="hora" name="hora">
          </div>
        </div>

        <div class="campo">
          <label for="valor">Valor (mg/dL)</label>
          <input type="number" id="valor" name="valor" placeholder="Ex: 96">
        </div>

        <div class="campo">
          <label for="contexto">Contexto</label>
          <select id="contexto" name="contexto">
            <option value="jejum">Jejum</option>
            <option value="pre-prandial">Pré-Prandial</option>
            <option value="pos-prandial">Pós-Prandial</option>
            <option value="antes-dormir">Antes de dormir</option>
          </select>
        </div>

        <div class="campo">
          <label for="refeicao">Refeição relacionada (opcional)</label>
          <select id="refeicao" name="refeicao">
            <option value="">Nenhuma</option>
          </select>
          <p class="ajuda">Ao vincular uma refeição, você pode identificar depois qual medição corresponde a ela.</p>
        </div>

        <div class="campo">
          <label for="observacao">Observação (opcional)</label>
          <input type="text" id="observacao" name="observacao" placeholder="Ex: Estresse no trabalho">
        </div>

        <button type="submit" class="btn btn-primario btn-full">Salvar Medição</button>

      </form>
    </div>

  </main>

</div>

<script src="../js/store.js"></script>
<script src="../js/comum.js"></script>
<script src="../js/registrar-glicemia.js"></script>
</body>
</html>
